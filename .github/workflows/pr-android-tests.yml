name: PR Android Tests
permissions:
  contents: read
on:
  pull_request:
    types: [labeled]
jobs:
  android-tests:
    if: github.event.label.name == 'run-android-tests'
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default    
          arch: x86_64
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-snapshot-save
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          boot-timeout: 600  
          script: ./gradlew connectedDebugAndroidTest

      # Lists the failing tests in the run's summary and annotations, without write access.
      - name: Report Test Results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: app/build/outputs/androidTest-results/**/*.xml
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
