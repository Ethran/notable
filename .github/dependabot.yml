# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"

    # Usually: one PR for Onyx, one for "the rest of the world".
    open-pull-requests-limit: 2

    ignore:
      # Patches and minor updates only; major (v1 to v2) updates stay manual.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # These remain fully manual.
      - dependency-name: "com.google.firebase:*"
      - dependency-name: "org.jetbrains.kotlin*"
      # AGP is resolved through its plugin IDs, not the com.android.tools.build artifact.
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.tools.build:*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "org.lsposed.hiddenapibypass:*"

    groups:
      # Group A: Onyx SDK
      # All Onyx updates (Patch or Minor) in one bucket.
      onyx-sdk:
        patterns:
          - "com.onyx.android.sdk:*"

      # Group B: The "Safe" Catch-All
      # This pulls every other allowed update into a single second PR.
      general-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "com.onyx.android.sdk:*"
          - "at.yawk.lz4:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
